<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Oujdi Dialect Classifier architecture</title><desc id="desc">Oujdi and Moroccan Darija corpora are cleaned and balanced, evaluated with three model families, then the selected transformer model serves predictions through Flask to a React interface.</desc><defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.t{font:600 18px Arial,sans-serif;fill:#0f172a}.s{font:14px Arial,sans-serif;fill:#475569}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect class="b" x="25" y="145" width="170" height="90"/><text class="t" x="110" y="180" text-anchor="middle">Corpora</text><text class="s" x="110" y="208" text-anchor="middle">Oujdi + Darija</text><rect class="b" x="245" y="145" width="190" height="90"/><text class="t" x="340" y="180" text-anchor="middle">Preprocessing</text><text class="s" x="340" y="208" text-anchor="middle">clean + script detect</text><rect class="b" x="500" y="25" width="185" height="80"/><text class="t" x="592" y="58" text-anchor="middle">TF-IDF + LR</text><text class="s" x="592" y="84" text-anchor="middle">baseline</text><rect class="b" x="500" y="150" width="185" height="80"/><text class="t" x="592" y="183" text-anchor="middle">BiLSTM</text><text class="s" x="592" y="209" text-anchor="middle">deep learning</text><rect class="b" x="500" y="275" width="185" height="80"/><text class="t" x="592" y="308" text-anchor="middle">DistilBERT + LoRA</text><text class="s" x="592" y="334" text-anchor="middle">selected model</text><rect class="b" x="760" y="145" width="170" height="90"/><text class="t" x="845" y="180" text-anchor="middle">Flask API</text><text class="s" x="845" y="208" text-anchor="middle">classification</text><rect class="b" x="995" y="145" width="170" height="90"/><text class="t" x="1080" y="180" text-anchor="middle">React UI</text><text class="s" x="1080" y="208" text-anchor="middle">text + confidence</text><path class="a" d="M195 190 H245"/><path class="a" d="M435 175 C465 175 465 65 500 65"/><path class="a" d="M435 190 H500"/><path class="a" d="M435 205 C465 205 465 315 500 315"/><path class="a" d="M685 315 C725 315 720 205 760 195"/><path class="a" d="M930 190 H995"/></svg>